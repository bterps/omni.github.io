  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.35) 100%);
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #fff;
  }

  .label {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 3.2vw, 2rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeSlideDown 1s ease-out 0.2s forwards;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 2px 16px rgba(0,0,0,0.6);
  }

  .days {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(10rem, 28vw, 22rem);
    line-height: 0.85;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeScaleIn 1.2s ease-out 0.6s forwards;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    color: #ffffff;
  }

  .sub {
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    font-size: clamp(0.7rem, 1.5vw, 1rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    margin-top: 0.8rem;
    opacity: 0;
    animation: fadeSlideUp 1s ease-out 1s forwards;
    color: rgba(255,255,255,0.5);
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }

  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeScaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <div class="label">Days to Omni Launch 🚀</div>
    <div class="days" id="days">—</div>
    <div class="sub">May 1, 2026</div>
  </div>

  <script>
    const target = new Date('2026-05-01T00:00:00+12:00');

    function update() {
      const now = new Date();
      const diff = target - now;
      const days = diff <= 0 ? 0 : Math.ceil(diff / (1000 * 60 * 60 * 24));
      document.getElementById('days').textContent = days;
    }

    update();
    setInterval(update, 60000);
  </script>
</body>
